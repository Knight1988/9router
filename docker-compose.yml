version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      cache_from:
        - type=local,src=/home/knight1988/docker-buildcache
      cache_to:
        - type=local,dest=/home/knight1988/docker-buildcache,mode=max
    ports:
      - "20128:20128"
      - "20129:20129"
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      HEADROOM_URL: http://headroom:8787
    depends_on:
      - headroom

  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    container_name: headroom
    restart: always
    ports:
      - "127.0.0.1:8787:8787"

volumes:
  9router_data:
    driver: local
    name: 9router_data
