trigger:
  branches:
    include:
      - latest
      - beta

pool:
  name: Ubuntu

variables:
  IMAGE_NAME: knight1988/9router
  DOCKER_TAG: $(Build.SourceBranchName)

stages:
  - stage: Test
    displayName: Build and Test
    jobs:
      - job: UnitTests
        displayName: Run Unit Tests
        pool:
          name: Ubuntu
        steps:
          - checkout: self
            displayName: Checkout source

          - script: |
              export NVM_DIR="$HOME/.nvm"
              [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
              export PATH="$(dirname "$(nvm which current 2>/dev/null || command -v node)"):$PATH"
              echo "Using node: $(which node) ($(node -v))"
              echo "Using npm:  $(which npm) ($(npm -v))"
              npm ci
              npm --prefix tests ci
              npm --prefix tests test
            displayName: Run Vitest unit tests

      - job: Test
        displayName: Build Docker and Run Tests
        dependsOn: UnitTests
        pool:
          name: Ubuntu
        steps:
          - checkout: self
            displayName: Checkout source

          - script: |
              set -euo pipefail
              docker compose -f docker-compose.yml -f docker-compose.ci.yml down

              # The self-hosted WSL runner can inherit an unavailable Tailscale DNS
              # server (100.100.100.100), which prevents Docker from resolving registries.
              resolv_backup=$(mktemp)
              cat /etc/resolv.conf > "$resolv_backup"
              printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' | sudo tee /etc/resolv.conf > /dev/null
              trap 'sudo cp "$resolv_backup" /etc/resolv.conf; rm -f "$resolv_backup"' EXIT
              getent hosts public.ecr.aws > /dev/null
              # BuildKit resolves base-image registries in the Docker daemon, not
              # the agent shell. Restart it after replacing the inherited resolver.
              sudo systemctl restart docker
              for i in $(seq 1 30); do
                docker info > /dev/null 2>&1 && break
                sleep 1
              done
              docker info > /dev/null

              build_ok=0
              for attempt in 1 2 3; do
                if docker compose -f docker-compose.yml -f docker-compose.ci.yml build; then
                  build_ok=1
                  break
                fi
                echo "Docker build attempt $attempt failed; retrying in 10s..."
                sleep 10
              done
              if [ "$build_ok" -ne 1 ]; then
                echo "Docker build failed after 3 attempts"
                exit 1
              fi
              docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d

              echo "Waiting for server to be ready..."
              server_ready=0
              for i in $(seq 1 30); do
                if curl -sk --max-time 10 https://localhost:21129/v1/models > /dev/null 2>&1; then
                  echo "Server ready."
                  server_ready=1
                  break
                fi
                sleep 2
              done
              if [ "$server_ready" -ne 1 ]; then
                echo "Server failed to become ready"
                docker compose -f docker-compose.yml -f docker-compose.ci.yml logs
                exit 1
              fi

              # The persistent CI volume may retain requireApiKey=true. Seed a
              # disposable key so the smoke test exercises the authenticated path.
              docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T app \
                node -e 'const Database=require("better-sqlite3"); const db=new Database("/var/lib/9router/db/data.sqlite"); db.prepare("INSERT OR REPLACE INTO apiKeys(id,key,name,machineId,isActive,createdAt,createdBy) VALUES(?,?,?,?,?,?,?)").run("ci-smoke","ci-smoke-key","CI smoke","ci",1,new Date().toISOString(),null); db.close()'

              PASS=0
              FAIL=0
              MAX_RETRIES=3
              RETRY_DELAY=10

              run_test() {
                local label="$1"
                local model="$2"

                for attempt in $(seq 1 $MAX_RETRIES); do
                  echo "=== $label (attempt $attempt/$MAX_RETRIES) ==="

                  response=$(docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T \
                    -e NODE_TLS_REJECT_UNAUTHORIZED=0 -e SMOKE_MODEL="$model" app \
                    node -e 'fetch("https://localhost:20129/v1/messages", {method:"POST", headers:{"content-type":"application/json","x-api-key":"ci-smoke-key","anthropic-version":"2023-06-01"}, body:JSON.stringify({model:process.env.SMOKE_MODEL,messages:[{role:"user",content:"say hi"}],max_tokens:50})}).then(async r=>{process.stdout.write(await r.text()); if(!r.ok) process.exitCode=1}).catch(e=>{console.error(e);process.exitCode=1})' \
                    2>&1 || true)

                  echo "$response"

                  # If all providers are unavailable (no accounts configured), treat as skip not fail
                  if echo "$response" | grep -qE "no eligible accounts|No active credentials"; then
                    echo "SKIP: no credentials for $model — provider not configured on this runner"
                    echo
                    return 0
                  fi

                  # Try SSE streaming format first (content_block_delta events)
                  content=$(echo "$response" | grep "content_block_delta" | grep -oE '"text"[[:space:]]*:[[:space:]]*"[^"]*"' | sed -E 's/"text"[[:space:]]*:[[:space:]]*"//g' | sed 's/"//g' | tr -d '\n' || true)
                  # Fall back to non-streaming JSON response format
                  if [ -z "$content" ]; then
                    content=$(echo "$response" | grep -oE '"text"[[:space:]]*:[[:space:]]*"[^"]*"' | head -1 | sed -E 's/"text"[[:space:]]*:[[:space:]]*"//g' | sed 's/"//g' || true)
                  fi

                  if [ -n "$content" ]; then
                    echo "PASS: $content"
                    PASS=$((PASS+1))
                    echo
                    return 0
                  fi

                  echo "Attempt $attempt failed: no content found."
                  if [ "$attempt" -lt "$MAX_RETRIES" ]; then
                    echo "Retrying in ${RETRY_DELAY}s..."
                    sleep $RETRY_DELAY
                  fi
                  echo
                done

                echo "FAIL: no content after $MAX_RETRIES attempts"
                FAIL=$((FAIL+1))
                return 1
              }

              for model in planning coding; do
                run_test "$model" "$model" || true
              done

              echo "Results: $PASS passed, $FAIL failed"

              docker compose -f docker-compose.yml -f docker-compose.ci.yml down

              if [ "$FAIL" -gt 0 ] && [ "$PASS" -eq 0 ]; then
                exit 1
              fi
            displayName: Run tests

  - stage: Build
    displayName: Build and Push Docker Image
    dependsOn: Test
    condition: and(succeeded(), or(eq(variables['Build.SourceBranchName'], 'latest'), eq(variables['Build.SourceBranchName'], 'beta')))
    jobs:
      - job: Build
        displayName: Build and Push
        pool:
          name: Ubuntu
        steps:
          - checkout: self
            displayName: Checkout source

          - script: |
              echo "Building Docker image $(IMAGE_NAME):$(DOCKER_TAG)..."
              docker build -t "$(IMAGE_NAME):$(DOCKER_TAG)" .
            displayName: Build Docker image

          - script: |
              echo "Pushing Docker image $(IMAGE_NAME):$(DOCKER_TAG)..."
              docker push "$(IMAGE_NAME):$(DOCKER_TAG)"
            displayName: Push Docker image

  - stage: Deploy
    displayName: Redeploy Dockge
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'beta'))
    jobs:
      - job: Deploy
        displayName: Redeploy via Dockge
        pool:
          name: Ubuntu
        steps:
          - script: |
              set -euo pipefail
              DOCKGE_URL="https://dark-knight-server.duckdns.org/dockge"
              STACK_NAME=9router
              MAX_RETRIES=3
              RETRY_DELAY=10

              echo "Triggering Dockge update (pull + redeploy) for stack ${STACK_NAME}..."
              for i in $(seq 1 $MAX_RETRIES); do
                echo "Attempt $i of $MAX_RETRIES..."
                CURL_EXIT=0
                HTTP_CODE=$(curl -sSL -o /tmp/dockge_response.json -w "%{http_code}" \
                  -X POST --connect-timeout 30 --max-time 300 \
                  -H "Authorization: Bearer $(DOCKGE_API_TOKEN)" \
                  "${DOCKGE_URL}/api/stacks/${STACK_NAME}/update" 2>/tmp/dockge_curl_err.txt) || CURL_EXIT=$?
                RESPONSE=$(cat /tmp/dockge_response.json 2>/dev/null || true)
                CURL_ERR=$(cat /tmp/dockge_curl_err.txt 2>/dev/null || true)
                echo "HTTP ${HTTP_CODE}: ${RESPONSE}${CURL_ERR}"
                if echo "$RESPONSE" | grep -q '"ok":[[:space:]]*true'; then
                  echo "Dockge redeploy successful."
                  exit 0
                fi
                echo "Attempt $i failed (curl exit ${CURL_EXIT}, HTTP ${HTTP_CODE})"
                if [ $i -lt $MAX_RETRIES ]; then
                  echo "Waiting ${RETRY_DELAY}s before retry..."
                  sleep $RETRY_DELAY
                fi
              done
              echo "All retry attempts failed."
              exit 1
            displayName: Redeploy 9router stack via Dockge
            env:
              DOCKGE_API_TOKEN: $(DOCKGE_API_TOKEN)
